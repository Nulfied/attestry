name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # The crypto backend is swappable, so both paths get exercised: one
          # job with cryptography installed and one with nothing but stdlib.
          - os: ubuntu-latest
            python: "3.11"
            extras: fast
          - os: ubuntu-latest
            python: "3.12"
            extras: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "fast" ]; then
            pip install -e ".[dev]"
          else
            pip install -e .
          fi

      - name: Report which crypto backend is active
        run: python -c "import attestry.ledger as l; print('backend:', l.BACKEND)"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Lint for unused names
        if: matrix.extras == 'fast'
        run: python -m pyflakes attestry tests

      - name: The quickstart from the README must actually work
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/smoke && cd /tmp/smoke
          attestry init .
          attestry drift run example
          ATTESTRY_ECHO_VARIANT=b attestry drift run example && exit 1 || test $? -eq 1
          attestry ledger verify
          attestry doctor

  build:
    name: package builds and installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel in a clean venv and run the CLI
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/attestry --version
